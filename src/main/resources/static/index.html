<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Messenger & Abuse Master</title>
    <!-- STOMP & SockJS client libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --border-color: #334155;
            --danger-color: #ef4444;
            --masked-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
        }

        .sidebar h2 {
            font-size: 1.25rem;
            color: var(--accent-color);
        }

        .user-config, .channel-selector {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, select, button {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-align: center;
        }

        .status-disconnected {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--danger-color);
        }

        .status-connected {
            background-color: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        /* Main Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--panel-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-bubble {
            max-width: 65%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.4;
            position: relative;
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-incoming {
            align-self: flex-start;
            background-color: var(--panel-bg);
            border-bottom-left-radius: 2px;
        }

        .message-outgoing {
            align-self: flex-end;
            background-color: var(--accent-color);
            border-bottom-right-radius: 2px;
        }

        .message-sender {
            font-size: 0.75rem;
            font-weight: bold;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .message-time {
            font-size: 0.65rem;
            color: #94a3b8;
            margin-top: 4px;
            text-align: right;
        }

        .badge-masked {
            background-color: var(--masked-color);
            color: #000;
            font-size: 0.65rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
        }

        .input-area input {
            flex: 1;
        }

        .profanity-warning {
            font-size: 0.75rem;
            color: var(--masked-color);
            padding: 0 20px 10px 20px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Sidebar Controls -->
    <div class="sidebar">
        <h2>🚀 Messenger Engine</h2>

        <div class="user-config">
            <label>Your Username</label>
            <input type="text" id="usernameInput" value="Alice" placeholder="e.g. Alice">
            <button id="connectBtn" onclick="toggleConnection()">Connect</button>
            <div id="statusBadge" class="status-badge status-disconnected">Disconnected</div>
        </div>

        <div class="channel-selector">
            <label>Mode / Target</label>
            <select id="chatMode" onchange="handleModeChange()">
                <option value="broadcast">Public Broadcast Channel</option>
                <option value="group">Group Room (#general)</option>
                <option value="private">1-on-1 Direct Message</option>
            </select>

            <div id="targetContainer" style="display: none;">
                <label id="targetLabel">Recipient Username</label>
                <input type="text" id="targetInput" value="Bob" placeholder="Recipient name...">
            </div>
        </div>

        <div style="margin-top: auto; font-size: 0.75rem; color: #64748b;">
            💡 <strong>Abuse Master Active:</strong> Words like <i>"stupid", "idiot", "hate", "abuse"</i> are intercepted & masked server-side in real-time.
        </div>
    </div>

    <!-- Main Chat Workspace -->
    <div class="chat-area">
        <div class="chat-header">
            <h3 id="currentChannelTitle">Public Broadcast Channel</h3>
        </div>

        <div class="messages-container" id="messagesContainer">
            <!-- Dynamic Message Bubbles -->
        </div>

        <div class="profanity-warning" id="profanityWarning">
            ⚠️ Warning: Abusive/profane terms detected and masked by Abuse Master!
        </div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let stompClient = null;
        let currentUser = "";
        let currentSubscriptions = [];

        function toggleConnection() {
            if (stompClient && stompClient.connected) {
                disconnect();
            } else {
                connect();
            }
        }

        function connect() {
            currentUser = document.getElementById("usernameInput").value.trim();
            if (!currentUser) return alert("Please enter a username!");

            const socket = new SockJS('/ws/stomp?username=' + encodeURIComponent(currentUser));
            stompClient = Stomp.over(socket);

            stompClient.connect({}, function (frame) {
                console.log('Connected: ' + frame);
                document.getElementById("statusBadge").className = "status-badge status-connected";
                document.getElementById("statusBadge").innerText = "Connected as " + currentUser;
                document.getElementById("connectBtn").innerText = "Disconnect";
                document.getElementById("usernameInput").disabled = true;

                // Subscribe to Private Direct Messages
                stompClient.subscribe('/user/queue/messages', function (messageOutput) {
                    onMessageReceived(JSON.parse(messageOutput.body));
                });

                // Subscribe to default broadcast channel
                subscribeChannels();
            }, function (error) {
                console.error("STOMP connection error:", error);
            });
        }

        function disconnect() {
            if (stompClient) {
                stompClient.disconnect();
            }
            document.getElementById("statusBadge").className = "status-badge status-disconnected";
            document.getElementById("statusBadge").innerText = "Disconnected";
            document.getElementById("connectBtn").innerText = "Connect";
            document.getElementById("usernameInput").disabled = false;
        }

        function handleModeChange() {
            const mode = document.getElementById("chatMode").value;
            const targetContainer = document.getElementById("targetContainer");
            const targetLabel = document.getElementById("targetLabel");
            const title = document.getElementById("currentChannelTitle");

            if (mode === "private") {
                targetContainer.style.display = "flex";
                targetLabel.innerText = "Recipient Username";
                title.innerText = "1-on-1 Direct Message";
            } else if (mode === "group") {
                targetContainer.style.display = "flex";
                targetLabel.innerText = "Room ID";
                title.innerText = "Group Chat Room";
            } else {
                targetContainer.style.display = "none";
                title.innerText = "Public Broadcast Channel";
            }

            if (stompClient && stompClient.connected) {
                subscribeChannels();
            }
        }

        function subscribeChannels() {
            // Unsubscribe existing non-private subscriptions
            currentSubscriptions.forEach(sub => sub.unsubscribe());
            currentSubscriptions = [];

            const mode = document.getElementById("chatMode").value;

            if (mode === "broadcast") {
                const sub = stompClient.subscribe('/topic/broadcast', function (messageOutput) {
                    onMessageReceived(JSON.parse(messageOutput.body));
                });
                currentSubscriptions.push(sub);
            } else if (mode === "group") {
                const roomId = document.getElementById("targetInput").value.trim() || "general";
                const sub = stompClient.subscribe('/topic/room.' + roomId, function (messageOutput) {
                    onMessageReceived(JSON.parse(messageOutput.body));
                });
                currentSubscriptions.push(sub);
            }
        }

        function sendMessage() {
            if (!stompClient || !stompClient.connected) {
                return alert("Please connect first!");
            }

            const content = document.getElementById("messageInput").value.trim();
            if (!content) return;

            const mode = document.getElementById("chatMode").value;
            const target = document.getElementById("targetInput").value.trim();

            const message = {
                type: 'CHAT',
                sender: currentUser,
                content: content
            };

            if (mode === 'private') {
                message.recipient = target;
                stompClient.send("/app/chat.private", {}, JSON.stringify(message));
                // Display outgoing DM locally for sender
                displayMessage(message, true);
            } else if (mode === 'group') {
                message.roomId = target || "general";
                stompClient.send("/app/chat.room/" + message.roomId, {}, JSON.stringify(message));
            } else {
                stompClient.send("/app/chat.broadcast", {}, JSON.stringify(message));
            }

            document.getElementById("messageInput").value = "";
        }

        function onMessageReceived(message) {
            const isOutgoing = message.sender === currentUser;
            displayMessage(message, isOutgoing);
        }

        function displayMessage(message, isOutgoing) {
            const container = document.getElementById("messagesContainer");
            const bubble = document.createElement("div");
            bubble.className = "message-bubble " + (isOutgoing ? "message-outgoing" : "message-incoming");

            const timeStr = new Date(message.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            let maskedBadgeHtml = message.masked ? `<span class="badge-masked">MASKED</span>` : "";

            if (message.masked) {
                document.getElementById("profanityWarning").style.display = "block";
                setTimeout(() => document.getElementById("profanityWarning").style.display = "none", 4000);
            }

            bubble.innerHTML = `
                <div class="message-sender">${escapeHtml(message.sender)} ${maskedBadgeHtml}</div>
                <div class="message-content">${escapeHtml(message.content)}</div>
                <div class="message-time">${timeStr}</div>
            `;

            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function escapeHtml(text) {
            return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : "";
        }
    </script>
</body>
</html>
